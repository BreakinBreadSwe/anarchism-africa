<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ANARCHISM.AFRICA — anarchist A">
  <!-- Clean anarchist mark: bold A inside a circle, white on black.
       No africa outline, no AI-tool watermark, no raster tracing —
       proper hand-authored vector geometry. Ships as the site logo,
       favicon, and PWA icon. -->
  <rect width="512" height="512" fill="#000"/>
  <g fill="none" stroke="#fff" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Enclosing circle -->
    <circle cx="256" cy="256" r="212" stroke-width="28"/>
    <!-- A: apex + two legs -->
    <path d="M 150 392 L 256 100 L 362 392" stroke-width="42"/>
    <!-- Crossbar extends past the legs, spanning the circle — the
         defining feature of the anarchist A. -->
    <line x1="82" y1="296" x2="430" y2="296" stroke-width="34"/>
  </g>
</svg>
